name: CI Lint Checks

on:
  push:
    branches:
      - main

permissions: read-all

jobs:
  packer-fmt:
    runs-on: ubuntu-latest
    steps:

    # Checkout Repository
    - name : Check out Git Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Packer fmt - Terraform Check
    - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
      name: Setup Packer
      with:
        version: 1.16.2

    # Print Packer version
    - name: Show version
      run: packer --version

    # Run packer fmt command in each directory recursively # use --force if you want to continue with workflow although errors are there
    - name: Run Packer fmt
      run: packer fmt -check -recursive .

  packer-validate:
    runs-on: ubuntu-latest
    steps:

    # Checkout Repository
    - name : Check out Git Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Packer validate - Terraform Check
    - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
      name: Setup Packer
      with:
        version: 1.16.2

    # Print Packer version
    - name: Show version
      run: packer --version

    # Run packer validate command in each directory recursively # use --force if you want to continue with workflow although errors are there
    - name: Run Packer validate
      run: packer validate ./packer/ubuntu-wordpress.pkr.hcl

  shellcheck:
    runs-on: ubuntu-latest
    steps:

    # Checkout Repository
    - name : Check out Git Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Shellcheck - Terraform Check
    - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
      name: Run Shellcheck

  tf-fmt:
    runs-on: ubuntu-latest
    steps:

    # Checkout Repository
    - name : Check out Git Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Terraform fmt - Terraform Check
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      name: Setup Terraform
      with:
        terraform_version: 1.17.0

    # Print Terraform version
    - name: Show version
      run: terraform --version

    # Run terraform fmt command in each directory recursively # use --force if you want to continue with workflow although errors are there
    - name: Run Terraform fmt
      run: terraform fmt -check -recursive .

  tf-validate:
    runs-on: ubuntu-latest
    steps:

    # Checkout Repository
    - name : Check out Git Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Terraform validate - Terraform Check
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      name: Setup Terraform
      with:
        terraform_version: 1.17.0

    # Print Terraform version
    - name: Show version
      run: terraform --version

    # Run terraform validate command in each directory recursively # use --force if you want to continue with workflow although errors are there
    - name: Run Terraform validate
      run: terraform -chdir ./terraform validate

  tflint:
    runs-on: ubuntu-latest
    steps:

    # Checkout Repository
    - name : Check out Git Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # TFLint - Terraform Check
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Cache plugin dir
      with:
        path: ~/.tflint.d/plugins
        key: ${{ matrix.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

    - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      name: Setup TFLint
      with:
        github_token: ${{ secrets.CI_GITHUB_TOKEN }}

    # Print TFLint version
    - name: Show version
      run: tflint --version

    # Install plugins
    - name: Init TFLint
      run: tflint --init

    # Run tflint command in each directory recursively # use --force if you want to continue with workflow although errors are there
    - name: Run TFLint
      run: tflint -f compact --recursive
